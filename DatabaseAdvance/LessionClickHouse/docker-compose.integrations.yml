# Optional lab services. Always combine this file with docker-compose.yml.
# Base ClickHouse remains independent when the `streaming` profile is omitted.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=redpanda:9092 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  redpanda_data:

