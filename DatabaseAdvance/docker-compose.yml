name: database-advance-lab

services:
  postgres:
    # PostgreSQL 17 is still supported and matches every PostgreSQL lesson.
    image: postgres:17.11-alpine
    container_name: database-advance-postgres
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: database-advance-clickhouse
    environment:
      CLICKHOUSE_DB: ecommerce
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: student_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native protocol
      - "9363:9363" # Prometheus metrics for the local lab
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - clickhouse_backups:/var/lib/clickhouse/backups
      - ./LessionClickHouse/sql:/docker-entrypoint-initdb.d:ro
      - ./LessionClickHouse/config.d/ops.xml:/etc/clickhouse-server/config.d/ops.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user student --password student_pass --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  clickhouse_backups:
