name: docker-compose-production

x-app-common: &app-common
  image: ${APP_IMAGE:-deep-docker/compose-api:dev}
  build:
    context: ./api
    target: runtime
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: app
    DB_USER: app
    DB_PASSWORD_FILE: /run/secrets/db_password
  secrets:
    - db_password
  networks:
    - data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: ${DB_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    shm_size: 128m
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app-common
    command: ["python", "migrate.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-common
    networks:
      - app
      - data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 128

  proxy:
    image: ${PROXY_IMAGE:-nginxinc/nginx-unprivileged:alpine}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-8083}:8080"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:

networks:
  app:
  data:
    internal: true
