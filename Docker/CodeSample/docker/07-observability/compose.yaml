name: docker-observability

services:
  app:
    container_name: docker-observability-app
    image: deep-docker/observable-app:dev
    build:
      context: ./app
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

networks:
  monitoring:
