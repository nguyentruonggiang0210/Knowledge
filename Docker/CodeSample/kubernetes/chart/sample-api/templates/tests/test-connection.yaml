apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sample-api.fullname" . }}-test
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ printf "%s:%s" .Values.testImage.repository .Values.testImage.tag | quote }}
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - {{ printf "http://%s:%v/livez" (include "sample-api.fullname" .) .Values.service.port | quote }}
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 8Mi
