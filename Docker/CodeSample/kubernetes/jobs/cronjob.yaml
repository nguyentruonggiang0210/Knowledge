apiVersion: batch/v1
kind: CronJob
metadata:
  name: periodic-report
  namespace: deep-k8s
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: periodic-report
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: busybox:1.36.1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - 'echo "periodic report started"; sleep 5; echo done'
              resources:
                requests:
                  cpu: 5m
                  memory: 4Mi
                limits:
                  cpu: 50m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
