# Concept sample: cần cài Gateway API CRDs và controller; thay "example" bằng GatewayClass thật.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-web
  namespace: deep-k8s
spec:
  gatewayClassName: example
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-api
  namespace: deep-k8s
spec:
  parentRefs:
    - name: public-web
      sectionName: http
  hostnames:
    - sample.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sample-api
          port: 80
