apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-spread-demo
  namespace: deep-k8s
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api-spread-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-api-spread-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sample-api-spread-demo
      containers:
        - name: api
          image: sample-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
