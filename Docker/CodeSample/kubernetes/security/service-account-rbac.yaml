apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
  namespace: deep-k8s
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: deep-k8s
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader
  namespace: deep-k8s
subjects:
  - kind: ServiceAccount
    name: config-reader
    namespace: deep-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
