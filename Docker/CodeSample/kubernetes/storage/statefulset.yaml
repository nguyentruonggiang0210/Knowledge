# Cần default StorageClass/provisioner. Đây là identity/PVC demo, không phải database production.
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: storage-lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: store
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store
  namespace: storage-lab
spec:
  serviceName: store
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: store
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - 'test -f /data/index.html || hostname > /data/index.html; exec httpd -f -p 8080 -h /data'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 128Mi
