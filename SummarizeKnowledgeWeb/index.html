<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const queryLocale = new URLSearchParams(location.search).get('lang')
        const savedLocale = localStorage.getItem('knowledge-atlas-locale')
        const locale =
          queryLocale === 'en' || queryLocale === 'vi'
            ? queryLocale
            : savedLocale === 'en' || savedLocale === 'vi'
              ? savedLocale
              : 'vi'
        document.documentElement.lang = locale
        document.documentElement.dataset.locale = locale
        const savedTheme = localStorage.getItem('knowledge-atlas-theme')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta
      name="description"
      content="Bản đồ kiến thức cô đọng từ toàn bộ workspace, được tổ chức để học và ôn tập."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Knowledge Atlas — Học từ toàn bộ workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
