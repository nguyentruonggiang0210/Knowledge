services:
  web:
    build:
      context: .
      dockerfile: src/TvWeb/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - DB_PATH=/app/data/tvweb.db
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - crawler

  crawler:
    build:
      context: .
      dockerfile: tool/Dockerfile
    environment:
      - DB_PATH=/app/data/tvweb.db
    volumes:
      - ./data:/app/data
      - ./tool/logs:/app/tool/logs
    restart: unless-stopped
