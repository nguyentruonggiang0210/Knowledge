services:
  app:
    build:
      context: .
    image: devops-demo:local
    environment:
      APP_ENV: local
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    restart: unless-stopped
    stop_grace_period: 30s
