apiVersion: v1
kind: Namespace
metadata:
  name: devops-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-demo
  namespace: devops-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-demo
  namespace: devops-lab
data:
  APP_ENV: kubernetes-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: devops-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-demo
    spec:
      serviceAccountName: devops-demo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devops-demo:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: devops-demo
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: devops-demo
  namespace: devops-lab
spec:
  selector:
    app.kubernetes.io/name: devops-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-demo
  namespace: devops-lab
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-demo
