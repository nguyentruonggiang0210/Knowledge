# Provider-neutral pseudocode; map stages to your CI system.
stages:
  pull_request:
    credentials: none-for-untrusted-code
    steps:
      - terraform fmt -check -recursive
      - terraform init -backend=false -input=false
      - terraform validate
      - terraform test
      - tflint
      - security-scan
      - policy-test
      - speculative-plan-on-trusted-pr

  protected_plan:
    trigger: protected-branch
    concurrency_group: environment-and-state-key
    short_lived_identity: true
    steps:
      - checkout-immutable-commit
      - terraform init -input=false
      - terraform plan -out=tfplan -input=false
      - terraform show -json tfplan
      - policy-and-cost-gates
      - encrypt-hash-and-store-plan-with-short-retention

  protected_apply:
    requires:
      - environment-approval
      - same-commit-lock-backend-and-plan-hash
    concurrency_group: environment-and-state-key
    steps:
      - terraform apply -input=false tfplan
      - smoke-test
      - full-no-change-plan
      - record-audit-metadata

